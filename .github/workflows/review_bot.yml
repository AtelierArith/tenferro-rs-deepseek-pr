name: review bot

# Delta-scoped REPOSITORY_RULES review for same-repo PRs. Fork PRs skip the
# LLM call and pass the gate job, matching CI_gpu.yml's same-repo-only pattern.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: review-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_WAIVE_LABEL: rules-review:waive

jobs:
  review-bot:
    name: repository rules review (LLM)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'rules-review:waive')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve merge base
        id: base
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          merge_base="$(git merge-base "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}")"
          echo "ref=${merge_base}" >> "${GITHUB_OUTPUT}"

      - name: Run repository rules review
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |
          set -euo pipefail
          python3 scripts/repository-rules-review.py \
            --base "${{ steps.base.outputs.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output-json review-report.json \
            | tee review-report.txt

      - name: Post PR summary comment
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            let body = "## Repository rules review\n\n";
            if (fs.existsSync("review-report.txt")) {
              body += "```text\n" + fs.readFileSync("review-report.txt", "utf8") + "\n```\n";
            } else {
              body += "Review step did not produce a report.\n";
            }

            const marker = "<!-- repository-rules-review -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body.includes(marker)
            );

            body += `\n${marker}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail on block findings
        if: steps.review.outcome == 'failure'
        run: |
          echo "Repository rules review reported block-severity findings."
          exit 1

  review-bot-waived:
    name: repository rules review (waived)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'rules-review:waive')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record waiver
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          merge_base="$(git merge-base "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}")"
          python3 scripts/repository-rules-review.py \
            --base "${merge_base}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --waived \
            --dry-run

  review-bot-gate:
    name: repository rules review
    needs: [review-bot, review-bot-waived]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require review result
        env:
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          REVIEW_RESULT: ${{ needs.review-bot.result }}
          WAIVED_RESULT: ${{ needs.review-bot-waived.result }}
          REVIEW_WAIVE_LABEL: ${{ env.REVIEW_WAIVE_LABEL }}
        run: |
          set -euo pipefail
          if [ "${IS_FORK_PR}" = "true" ]; then
            echo "Fork PR: repository rules LLM review skipped."
            exit 0
          fi
          if [ "${WAIVED_RESULT}" = "success" ]; then
            echo "Review waived via label ${REVIEW_WAIVE_LABEL}."
            exit 0
          fi
          if [ "${REVIEW_RESULT}" = "success" ]; then
            exit 0
          fi
          echo "Expected review-bot success or waiver; got review-bot=${REVIEW_RESULT} waived=${WAIVED_RESULT}"
          exit 1
